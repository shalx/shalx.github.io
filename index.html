<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fix-Pin</title>

    <meta
        name="theme-color"
        content="#6750a4"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div id="map"></div>

    <div class="top">

        <button
            id="alertBtn"
            type="button"
            aria-label="Get current location"
        >
            ⦿
        </button>

    </div>

    <input
        id="input1"
        type="text"
        placeholder="Lat, Lon"
        autocomplete="off"
    >

    <input
        id="myInput"
        type="text"
        placeholder="Note..."
        autocomplete="off"
    >

    <button
        id="myButton"
        type="button"
    >
        SAVE
    </button>

    <ol id="data-list"></ol>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="app.js"></script>

</body>

</html>
