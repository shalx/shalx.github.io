<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fix-Pin</title>

    <meta
        name="theme-color"
        content="#4285F4"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="app-container">

        <div id="map"></div>

        <input
            id="myInput"
            type="text"
            placeholder="Note..."
            autocomplete="off"
        >

        <div class="actions">

            <button
                id="alertBtn"
                type="button"
                title="Get current location"
                aria-label="Get current location"
            >
                <i class="ph ph-crosshair"></i>
            </button>

            <button
                id="myButton"
                type="button"
                title="Save point"
            >
                <i class="ph ph-floppy-disk"></i>
                <span>Save</span>
            </button>

            <button
                id="goToSelectedBtn"
                type="button"
                title="Open points shown on the map in Google Maps"
            >
                <i class="ph ph-navigation-arrow"></i>
                <span>Go To</span>
            </button>

            <button
                id="openFileBtn"
                type="button"
                title="Open an FXPN file"
            >
                <i class="ph ph-folder-open"></i>
                <span>Open File</span>
            </button>

            <button
                id="saveFileBtn"
                type="button"
                title="Save points to an FXPN file"
            >
                <i class="ph ph-download-simple"></i>
                <span>Save to File</span>
            </button>

        </div>

        <input
            id="searchInput"
            type="search"
            placeholder="Search..."
            autocomplete="off"
            aria-label="Search saved points"
        >

        <ol id="data-list"></ol>

        <input
            id="fileInput"
            type="file"
            accept=".fxpn,application/json"
            hidden
        >

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="storage.js"></script>
    <script src="files.js"></script>
    <script src="map.js"></script>
    <script src="app.js"></script>

</body>

</html>
