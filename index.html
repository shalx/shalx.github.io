<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>fix pin</title>

  <meta
    name="theme-color"
    content="#6200EE"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    :root {
      --primary: #6200EE;
      --accent: #03DAC5;
      --danger: #CF6679;
      --bg: #F5F5F5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      margin: 0;
      background: var(--bg);
      padding: 14px;

      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #map {
      height: 250px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      padding: 12px;

      border: none;
      border-radius: 8px;
    }

    button {
      background: var(--primary);
      color: #ffffff;

      border: none;
      border-radius: 8px;

      padding: 12px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .top {
      display: flex;
      gap: 6px;
    }

    .top button {
      flex: 1;
      background: var(--accent);
    }

    ol {
      list-style: none;
      padding: 0;
      margin: 0;

      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    li {
      background: #ffffff;
      border-radius: 12px;
      padding: 10px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .left {
      flex: 1;

      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;

      min-width: 0;
    }

    .left span {
      overflow-wrap: anywhere;
    }

    .mini {
      width: 28px;
      height: 28px;

      flex-shrink: 0;

      border-radius: 50%;
      padding: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 14px;

      background: #eeeeee;
      color: #333333;
    }

    .map-inline {
      color: var(--accent);
    }

    .del-btn {
      color: var(--danger);
      font-weight: bold;
      font-size: 16px;
    }

    .share-btn {
      background: var(--accent);
      color: #ffffff;
      font-size: 12px;
    }

    .pulse-marker {
      width: 16px;
      height: 16px;

      background: var(--accent);
      border: 2px solid #ffffff;
      border-radius: 50%;

      box-shadow: 0 0 0 0 var(--accent);

      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow:
          0 0 0 0 rgba(3, 218, 197, 0.5);
      }

      70% {
        box-shadow:
          0 0 0 15px rgba(3, 218, 197, 0);
      }

      100% {
        box-shadow:
          0 0 0 0 rgba(3, 218, 197, 0);
      }
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div class="top">
    <button
      id="alertBtn"
      type="button"
      aria-label="Get current location"
    >
      ⦿
    </button>
  </div>

  <input
    id="input1"
    type="text"
    placeholder="Lat, Lon"
    autocomplete="off"
  >

  <input
    id="myInput"
    type="text"
    placeholder="Note..."
    autocomplete="off"
  >

  <button
    id="myButton"
    type="button"
  >
    SAVE
  </button>
  <button
    id="saved-points-btn">

    SAVED POINTS

</button>

  <ol id="data-list"></ol>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>

</body>
</html>
