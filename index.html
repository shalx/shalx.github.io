<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fix-Pin</title>

    <meta
        name="theme-color"
        content="#4285F4"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="app-container">

        <!-- =====================================
        HEADER
        ====================================== -->

        <header class="app-header">

            <h1 class="app-title">
                Fix-Pin
            </h1>

            <button
                id="menuBtn"
                class="menu-button"
                type="button"
                title="Open menu"
                aria-label="Open menu"
                aria-expanded="false"
                aria-controls="appMenu"
            >
                <i class="ph ph-list"></i>
            </button>

        </header>


        <!-- =====================================
        MENU
        ====================================== -->

        <div
            id="menuOverlay"
            class="menu-overlay"
            hidden
        ></div>

        <nav
            id="appMenu"
            class="app-menu"
            aria-label="Fix-Pin menu"
            hidden
        >

            <div class="menu-header">

                <strong>
                    Menu
                </strong>

                <button
                    id="closeMenuBtn"
                    class="menu-close-button"
                    type="button"
                    title="Close menu"
                    aria-label="Close menu"
                >
                    <i class="ph ph-x"></i>
                </button>

            </div>

            <button
                id="openFileBtn"
                class="menu-item"
                type="button"
                title="Open an FXPN file"
            >
                <i class="ph ph-folder-open"></i>

                <span>
                    Open File
                </span>
            </button>

            <button
                id="saveFileBtn"
                class="menu-item"
                type="button"
                title="Save points to an FXPN file"
            >
                <i class="ph ph-download-simple"></i>

                <span>
                    Save to File
                </span>
            </button>

            <button
                id="aboutBtn"
                class="menu-item"
                type="button"
                title="About Fix-Pin"
            >
                <i class="ph ph-info"></i>

                <span>
                    About Fix-Pin
                </span>
            </button>

        </nav>


        <!-- =====================================
        MAP
        ====================================== -->

        <div id="map"></div>


        <!-- =====================================
        NOTE
        ====================================== -->

        <input
            id="myInput"
            type="text"
            placeholder="Note..."
            autocomplete="off"
            aria-label="Point note"
        >


        <!-- =====================================
        MAIN ACTIONS
        ====================================== -->

        <div class="actions">

            <button
                id="alertBtn"
                type="button"
                title="Get current location"
                aria-label="Get current location"
            >
                <i class="ph ph-crosshair"></i>
            </button>

            <button
                id="myButton"
                type="button"
                title="Save point"
            >
                <i class="ph ph-floppy-disk"></i>

                <span>
                    Save
                </span>
            </button>

            <button
                id="goToSelectedBtn"
                type="button"
                title="Open points shown on the map in Google Maps"
            >
                <i class="ph ph-navigation-arrow"></i>

                <span>
                    Go To
                </span>
            </button>

        </div>


        <!-- =====================================
        SEARCH
        ====================================== -->

        <input
            id="searchInput"
            type="search"
            placeholder="Search..."
            autocomplete="off"
            aria-label="Search saved points"
        >


        <!-- =====================================
        SAVED POINTS
        ====================================== -->

        <ol id="data-list"></ol>


        <!-- =====================================
        FILE INPUT
        ====================================== -->

        <input
            id="fileInput"
            type="file"
            accept=".fxpn,application/json"
            hidden
        >

    </main>


    <!-- =====================================
    ABOUT FIX-PIN
    ====================================== -->

    <dialog
        id="aboutDialog"
        class="about-dialog"
    >

        <div class="about-content">

            <div class="about-header">

                <h2>
                    About Fix-Pin
                </h2>

                <button
                    id="closeAboutBtn"
                    class="about-close-button"
                    type="button"
                    title="Close"
                    aria-label="Close About Fix-Pin"
                >
                    <i class="ph ph-x"></i>
                </button>

            </div>

            <p>
                Fix-Pin is a simple application for saving locations,
                adding notes and opening saved points in Google Maps.
            </p>

            <p>
                Saved points are stored on your device.
                You can also save them to an FXPN file and open them later.
            </p>

            <p class="about-version">
                Version 1.0
            </p>

        </div>

    </dialog>


    <!-- =====================================
    SCRIPTS
    ====================================== -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="storage.js"></script>
    <script src="files.js"></script>
    <script src="map.js"></script>
    <script src="app.js"></script>
<div id="toast" class="toast">
    ✓ Pin saved
</div>
</body>

</html>
