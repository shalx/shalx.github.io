<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fix-Pin</title>

    <meta
        name="theme-color"
        content="#4285F4"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="app-container">

        <div
            id="map"
            aria-label="Map"
        ></div>

        <input
            id="myInput"
            type="text"
            placeholder="Add note..."
            autocomplete="off"
            maxlength="200"
        >

        <div class="actions">

            <button
                id="alertBtn"
                type="button"
                aria-label="Get GPS location"
            >
                <span class="button-icon">⦿</span>
                <span>Get GPS</span>
            </button>

            <button
                id="myButton"
                type="button"
                aria-label="Save current point"
            >
                <span class="button-icon">▣</span>
                <span>Save</span>
            </button>

            <button
                id="gotoButton"
                type="button"
                aria-label="Open selected points in Google Maps"
            >
                <span class="button-icon">➤</span>
                <span>Go To</span>
            </button>

            <button
                id="importButton"
                type="button"
                aria-label="Import saved points"
            >
                <span class="button-icon">⇩</span>
                <span>Import</span>
            </button>

            <button
                id="exportButton"
                type="button"
                aria-label="Export saved points"
            >
                <span class="button-icon">⇧</span>
                <span>Export</span>
            </button>

            <button
                id="deleteButton"
                type="button"
                aria-label="Delete selected points"
            >
               
                <span>Delete</span>
            </button>

        </div>

        <input
            id="importFileInput"
            type="file"
            accept=".fixpin,application/json"
            hidden
        >

        <ol
            id="data-list"
            aria-label="Saved points"
        ></ol>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="app.js"></script>

</body>

</html>
