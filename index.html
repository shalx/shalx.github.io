<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fix-Pin</title>

    <meta
        name="theme-color"
        content="#4285F4"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="app-container">

        <div id="map"></div>

        <input
            id="input1"
            type="text"
            placeholder="Lat, Lon"
            readonly
            autocomplete="off"
        >

        <input
            id="myInput"
            type="text"
            placeholder="Note..."
            autocomplete="off"
        >

        <div class="actions">

            <button id="alertBtn">
                <i class="ph ph-crosshair"></i>
            </button>

            <button id="myButton">
                <i class="ph ph-floppy-disk"></i>
                Save
            </button>

            <button id="openFileBtn">
                <i class="ph ph-folder-open"></i>
                Open File
            </button>

            <button id="saveFileBtn">
                <i class="ph ph-download-simple"></i>
                Save to File
            </button>

        </div>

        <input
            id="searchInput"
            type="text"
            placeholder="Search..."
            autocomplete="off"
        >

        <ol id="data-list"></ol>
<input
    id="fileInput"
    type="file"
    accept=".fxpn,application/json"
    hidden
>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="storage.js"></script>
    <script src="files.js"></script>
    <script src="map.js"></script>
    <script src="app.js"></script>

</body>

</html>
