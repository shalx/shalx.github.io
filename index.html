<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fix-Pin</title>

    <meta
        name="theme-color"
        content="#6750a4"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="app-container">

        <div id="map"></div>

        <input
            id="input1"
            type="text"
            placeholder="Lat, Lon"
            autocomplete="off"
            readonly
        >

        <input
            id="myInput"
            type="text"
            placeholder="Note..."
            autocomplete="off"
        >

        <div class="actions">

            <button
                id="alertBtn"
                type="button"
                aria-label="Get current location"
            >
                <span class="button-icon">⦿</span>
                <span>GET LOCATION</span>
            </button>

            <button
                id="myButton"
                type="button"
                aria-label="Save point"
            >
                <span class="button-icon">▣</span>
                <span>SAVE</span>
            </button>

            <button
                id="gotoButton"
                type="button"
                aria-label="Open selected points in Google Maps"
            >
                <span class="button-icon">➤</span>
                <span>GO TO</span>
            </button>

            <button
                id="importButton"
                type="button"
                aria-label="Import points"
            >
                <span class="button-icon">⇩</span>
                <span>IMPORT</span>
            </button>

            <button
                id="exportButton"
                type="button"
                aria-label="Export points"
            >
                <span class="button-icon">⇧</span>
                <span>EXPORT</span>
            </button>

            <button
                id="deleteButton"
                type="button"
                aria-label="Delete selected points"
            >
                <span class="button-icon">×</span>
                <span>DELETE</span>
            </button>

        </div>

        <input
            id="importFileInput"
            type="file"
            accept=".fixpin,application/json"
            hidden
        >

        <ol id="data-list"></ol>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="app.js"></script>

</body>

</html>
